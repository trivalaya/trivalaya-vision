# M1 serving enable — owner-signed 2026-07-28, LEG 1 (serving) ONLY.
# Exactly one variable, set at exec so appv2.py:43-49's .env setdefault cannot
# touch it (setdefault never overrides an exec-set var).
#
# DO NOT add EnvironmentFile=.env here, and DO NOT put this flag in .env:
# trivalaya-runner reads .env via EnvironmentFile and would silently enable M1
# for INGEST at its next restart, which is NOT approved.
[Service]
Environment=TRIVALAYA_BG_CORNER_LOCAL_TRUST=1
